services:
  akasha:
    image: ghcr.io/m17y/akasha:latest
    # build: .  # 本地构建时取消注释此行，注释上面的 image
    container_name: akasha
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - akasha-data:/data
    environment:
      # ── 数据目录（容器内固定路径，无需修改）──
      - AKASHA_VAULT_PATH=/data/akasha
      - AKASHA_CHROMA_DIR=/data/chroma
      # ── LLM 配置（必填）──
      - AKASHA_LLM_PROVIDER=anthropic
      - AKASHA_LLM_API_KEY=sk-xxx
      - AKASHA_LLM_BASE_URL=https://api.minimaxi.com/anthropic
      - AKASHA_LLM_MODEL=MiniMax-M2.7
      # ── 飞书通道（不用可删除）──
      - AKASHA_FEISHU_APP_ID=
      - AKASHA_FEISHU_APP_SECRET=
      # ── GitHub Pages 部署（不用可留空）──
      - AKASHA_SITE_REPO=
      # ── 语音转写（不配则用容器内置 faster-whisper，CPU 较慢）──
      # - AKASHA_WHISPER_API_KEY=gsk_xxx
      # - AKASHA_WHISPER_BASE_URL=https://api.groq.com/openai/v1
      # - AKASHA_WHISPER_MODEL=whisper-large-v3
      # ── Wiki 网站预览（设为 true 启用，端口 8800）──
      - AKASHA_SITE_SERVE=false
    ports:
      - "8800:8800"

volumes:
  akasha-data:
