name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "vault/**"
      - "akasha/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Build site
        run: uv run akasha-site build
        env:
          AKASHA_VAULT_PATH: ${{ github.workspace }}/vault

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vault/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
