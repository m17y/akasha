[project]
name = "akasha"
version = "1.0.0"
description = "Akasha — 个人 AI 知识库引擎，语义搜索 + LLM Wiki 知识编译 + Agent"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.25.0",
    "chromadb>=0.5",
    "pyyaml>=6.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "httpx>=0.27",
    "mkdocs-material>=9.5",
    "lark-oapi>=1.3",
    "uvicorn>=0.30",
    "starlette>=0.38",
]

[project.scripts]
akasha = "akasha.serve.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akasha"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
